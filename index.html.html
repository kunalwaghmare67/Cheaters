<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serial Cheaters</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #00cccc;
    --red-bright: #00ffff;
    --red-glow: #00ffff88;
    --bg: #050508;
    --surface: #0c0c12;
    --border: #001a1a;
    --text: #e8e8e8;
    --muted: #667;
    --code-bg: #07070d;
    --gold: #c9a84c;
    --gold-bright: #f0c060;
    --gold-glow: #f0c06055;
    --gold-border: #3a2800;
  }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; overflow-x: hidden; }

  /* ── HERO ── */
  #hero {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.35;
    z-index: 0;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 15%, #050508dd 75%);
    z-index: 1;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
  }

  .hero-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(2.8rem, 8vw, 7rem);
    font-weight: 900;
    color: var(--red-bright);
    text-shadow:
      0 0 10px #00ffff,
      0 0 30px var(--red-glow),
      0 0 70px var(--red-glow),
      0 0 140px #00ffff33,
      2px 2px 0 #003333,
      4px 4px 0 #002222;
    letter-spacing: 0.04em;
    line-height: 1.1;
    cursor: default;
    word-break: break-word;
    padding: 0 0.5rem;
    transition: all 0.3s ease;
    animation: flicker 6s infinite;
  }

  .hero-title:hover {
    text-shadow:
      0 0 10px #00ffff,
      0 0 40px #00ffff,
      0 0 90px var(--red-glow),
      0 0 180px #00ffff44,
      0 0 260px #00ffff22,
      2px 2px 0 #004444,
      5px 5px 0 #003333;
    transform: scale(1.04) skewX(-1deg);
    color: #66ffff;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.85; }
    97% { opacity: 1; }
    98% { opacity: 0.7; }
    99% { opacity: 1; }
  }

  .hero-sub {
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .btn-experiments {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.9rem 2.4rem;
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red-bright);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.95rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-experiments::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--red);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: -1;
  }

  .btn-experiments:hover::before { transform: translateX(0); }
  .btn-experiments:hover { color: #fff; border-color: var(--red-bright); box-shadow: 0 0 20px var(--red-glow); }

  /* ── EXPERIMENTS DRAWER ── */
  #exp-drawer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000000cc;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.2s ease;
  }

  #exp-drawer.open { display: flex; align-items: center; justify-content: center; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .drawer-panel {
    background: var(--surface);
    border: 1px solid var(--gold-border);
    width: min(420px, 92vw);
    max-height: 80vh;
    overflow-y: auto;
    padding: 2rem;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes slideUpSheet { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--gold-border);
    padding-bottom: 1rem;
  }

  .drawer-header h2 {
    font-family: 'Cinzel Decorative', serif;
    font-size: 1.1rem;
    color: var(--gold-bright);
    letter-spacing: 0.05em;
    text-shadow: 0 0 12px var(--gold-glow);
  }

  .close-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
    transition: color 0.2s;
  }
  .close-btn:hover { color: var(--red-bright); }

  .exp-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }

  .exp-list li button {
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid #1a1a1a;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.88rem;
    padding: 0.8rem 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .exp-list li button .exp-num {
    color: var(--gold);
    min-width: 2.5ch;
    font-size: 0.75rem;
  }

  .exp-list li button:hover {
    border-color: var(--gold);
    color: var(--gold-bright);
    background: #1a0f00;
    box-shadow: inset 3px 0 0 var(--gold);
  }

  /* ── EXP PAGE ── */
  #exp-page {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: var(--bg);
    overflow-y: auto;
    animation: fadeIn 0.2s ease;
  }

  #exp-page.open { display: block; }

  .exp-topbar {
    position: sticky;
    top: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--gold-border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    z-index: 10;
  }

  .back-btn {
    background: none;
    border: 1px solid var(--gold-border);
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.1em;
  }
  .back-btn:hover { border-color: var(--gold); color: var(--gold-bright); }

  .exp-topbar h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.95rem;
    color: var(--gold-bright);
    text-shadow: 0 0 10px var(--gold-glow);
    flex: 1;
  }

  .exp-body {
    max-width: 860px;
    margin: 0 auto;
    padding: 2.5rem 2rem 4rem;
  }

  .exp-body h2 {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.85rem;
    color: var(--gold-bright);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin: 2rem 0 0.6rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--gold-border);
    text-shadow: 0 0 8px var(--gold-glow);
  }

  .exp-body p, .exp-body li {
    font-size: 0.88rem;
    line-height: 1.8;
    color: #bbb;
    margin-bottom: 0.4rem;
  }

  .exp-body ul { padding-left: 1.2rem; margin-bottom: 0.8rem; }

  .code-block {
    position: relative;
    margin: 1rem 0;
    background: var(--code-bg);
    border: 1px solid #1a1000;
    border-left: 3px solid var(--gold);
  }

  .code-block pre {
    padding: 1.2rem 1rem;
    overflow-x: auto;
    font-size: 0.82rem;
    line-height: 1.65;
    color: #d4d4d4;
    white-space: pre;
    font-family: 'Share Tech Mono', monospace;
  }

  .copy-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    background: #100a00;
    border: 1px solid var(--gold-border);
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .copy-btn:hover { border-color: var(--gold); color: var(--gold-bright); }
  .copy-btn.copied { border-color: #00aa44; color: #00cc55; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--gold-border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    .hero-title {
      font-size: clamp(1.9rem, 12.5vw, 3rem);
      letter-spacing: 0.01em;
      line-height: 1.18;
      padding: 0 0.8rem;
    }
    .hero-title:hover { transform: none; }
    .hero-content { gap: 1.6rem; padding: 0 1rem; width: 100%; }
    .hero-sub { font-size: 0.68rem; letter-spacing: 0.18em; }
    .btn-experiments { padding: 0.85rem 1.6rem; font-size: 0.8rem; letter-spacing: 0.1em; min-height: 48px; }

    /* drawer slides up from bottom */
    #exp-drawer.open { align-items: flex-end; }
    .drawer-panel {
      width: 100vw;
      max-height: 88vh;
      border-left: none;
      border-right: none;
      border-bottom: none;
      padding: 1.4rem 1rem 2rem;
      animation-name: slideUpSheet;
    }
    .drawer-header h2 { font-size: 0.92rem; }
    .exp-list li button { font-size: 0.8rem; padding: 0.9rem 0.75rem; min-height: 48px; line-height: 1.4; }

    /* exp page */
    .exp-topbar { padding: 0.7rem 0.9rem; flex-wrap: wrap; gap: 0.4rem; }
    .exp-topbar h1 { font-size: 0.68rem; width: 100%; text-align: center; padding-top: 0.2rem; order: 1; }
    .back-btn { order: 0; font-size: 0.72rem; min-height: 36px; padding: 0.35rem 0.9rem; }
    .exp-body { padding: 1.2rem 0.9rem 5rem; }
    .exp-body h2 { font-size: 0.68rem; letter-spacing: 0.08em; margin-top: 1.6rem; }
    .exp-body p, .exp-body li { font-size: 0.8rem; line-height: 1.72; }
    .code-block pre { font-size: 0.68rem; padding: 2.8rem 0.75rem 0.9rem; line-height: 1.55; }
    .copy-btn { font-size: 0.62rem; padding: 0.28rem 0.55rem; top: 0.4rem; right: 0.4rem; }
  }

  /* touch devices — remove hover-only fill, use active instead */
  @media (hover: none) {
    .btn-experiments::before { display: none; }
    .btn-experiments:active { background: var(--red); color: #050508; }
    .exp-list li button:active { background: #1a0f00; border-color: var(--gold); color: var(--gold-bright); box-shadow: inset 3px 0 0 var(--gold); }
    .back-btn:active { border-color: var(--gold); color: var(--gold-bright); }
    .copy-btn:active { border-color: var(--gold); color: var(--gold-bright); }
  }
</style>
</head>
<body>

<!-- ── HERO ── -->
<section id="hero">
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="bg.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div>
      <p class="hero-sub">↯ &nbsp; os lab &nbsp; ↯</p>
    </div>
    <h1 class="hero-title">Serial<br>Cheaters</h1>
    <button class="btn-experiments" onclick="openDrawer()">
      &#x2665; &nbsp; Experiments
    </button>
  </div>
</section>

<!-- ── EXPERIMENTS DRAWER ── -->
<div id="exp-drawer" onclick="closeDrawerOutside(event)">
  <div class="drawer-panel">
    <div class="drawer-header">
      <h2>Experiments</h2>
      <button class="close-btn" onclick="closeDrawer()">✕</button>
    </div>
    <ul class="exp-list" id="exp-list"></ul>
  </div>
</div>

<!-- ── EXP PAGE ── -->
<div id="exp-page">
  <div class="exp-topbar">
    <button class="back-btn" onclick="closePage()">← Back</button>
    <h1 id="exp-page-title"></h1>
  </div>
  <div class="exp-body" id="exp-page-body"></div>
</div>

<script>
const experiments = [
  {
    title: "Experiment 1 — Basic Linux Commands & System Calls",
    aim: "To explore the usage of basic Linux commands and system calls for file, directory, and process management.",
    theory: `Linux provides powerful tools for managing files, directories, and processes. Linux commands are used at the user level for actions like creating directories, listing files, changing permissions, sorting data, and finding patterns. System calls allow low-level communication between programs and the kernel, enabling file operations such as open(), read(), write(), and close(), as well as process identification using getpid(), getuid(), etc.`,
    sections: [
      { heading: "Basic Linux Commands", content: `mkdir experiment1\ncd experiment1\necho "Hello Linux" > file1.txt\ncat file1.txt\nls -l\nchmod 755 file1.txt\ngrep Hello file1.txt\ntouch fruits.txt\nsort fruits.txt\nps -aux` },
      { heading: "System Calls Program (C)", content: `#include <fcntl.h>\n#include <unistd.h>\n#include <stdio.h>\n\nint main() {\n    int fd = open("demo.txt", O_CREAT | O_RDWR, 0644);\n    write(fd, "System Call Demo", 17);\n\n    char buffer[50];\n    lseek(fd, 0, SEEK_SET);\n    read(fd, buffer, 17);\n\n    printf("File Content: %s\\n", buffer);\n    close(fd);\n\n    printf("Process ID: %d\\n", getpid());\n    printf("User ID: %d\\n", getuid());\n    return 0;\n}` },
      { heading: "Compile & Run", content: `gcc syscalls.c -o syscalls\n./syscalls` },
    ],
    conclusion: "Students successfully explored essential Linux commands and system calls, gaining practical understanding of file handling, directory management, and process interaction within the Linux operating system."
  },
  {
    title: "Experiment 2 — Shell Scripts",
    aim: "To study and implement the shell scripts.",
    theory: `Shell scripts are short programs written in a shell programming language and interpreted by a shell process. They are extremely useful for automating tasks on Linux and other Unix-like operating systems. The default shell on Linux is bash.`,
    sections: [
      { heading: "Hello World Shell Script", content: `#!/bin/bash\necho "HELLO WORLD"` },
      { heading: "Top 10 Processes by Memory", content: `ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%mem | head` },
      { heading: "Current User & Logname", content: `echo "Hi, $USER! Let us be friends."\necho "Hello, $LOGNAME!"` },
      { heading: "OS Version & Kernel Info", content: `uname -a\nuname -r\ncat /proc/version\ncat /etc/issue` },
    ],
    conclusion: "Thus we have studied and implemented shell script programs successfully."
  },
  {
    title: "Experiment 3 — Linux Commands using Kernel APIs",
    aim: "Implementation of Basic Linux Commands using Kernel APIs.",
    theory: `Linux commands are user-level programs that interact with the OS through kernel system calls. Commands such as ls, cp, and mv internally use open(), read(), write(), close(), rename(), and getdents() to perform file operations.`,
    sections: [
      { heading: "ls Implementation (C)", content: `#include <stdio.h>\n#include <fcntl.h>\n#include <unistd.h>\n#include <sys/syscall.h>\n\nstruct linux_dirent {\n    long d_ino;\n    off_t d_off;\n    unsigned short d_reclen;\n    char d_name[];\n};\n\nint main() {\n    int fd = open(".", O_RDONLY);\n    char buf[1024];\n    int nread;\n    while ((nread = syscall(SYS_getdents, fd, buf, sizeof(buf))) > 0) {\n        int pos = 0;\n        while (pos < nread) {\n            struct linux_dirent *d = (struct linux_dirent *)(buf + pos);\n            printf("%s\\n", d->d_name);\n            pos += d->d_reclen;\n        }\n    }\n    close(fd);\n    return 0;\n}` },
      { heading: "cp Implementation (C)", content: `#include <stdio.h>\n#include <fcntl.h>\n#include <unistd.h>\n\nint main(int argc, char *argv[]) {\n    int src = open(argv[1], O_RDONLY);\n    int dest = open(argv[2], O_CREAT | O_WRONLY, 0644);\n    char buf[100];\n    int n;\n    while ((n = read(src, buf, sizeof(buf))) > 0) {\n        write(dest, buf, n);\n    }\n    close(src);\n    close(dest);\n    printf("File copied successfully\\n");\n    return 0;\n}` },
      { heading: "mv Implementation (C)", content: `#include <stdio.h>\n\nint main(int argc, char *argv[]) {\n    if (rename(argv[1], argv[2]) == 0)\n        printf("File moved successfully\\n");\n    else\n        perror("Error");\n    return 0;\n}` },
      { heading: "Compile & Run", content: `gcc ls.c -o ls_cmd\ngcc cp.c -o cp_cmd\ngcc mv.c -o mv_cmd\n\n./ls_cmd\n./cp_cmd source.txt dest.txt\n./mv_cmd old.txt new.txt` },
    ],
    conclusion: "This experiment demonstrated the internal working of basic Linux commands using kernel system calls."
  },
  {
    title: "Experiment 4 — fork(), getpid(), getppid()",
    aim: "Create a child process using fork(), display PID of parent & child using getpid() and getppid().",
    theory: `fork() creates a new child process. The child receives 0 as return value, while the parent receives the PID of the child. getpid() returns the current process ID and getppid() returns the parent process ID.`,
    sections: [
      { heading: "fork() Program (C)", content: `#include <stdio.h>\n#include <unistd.h>\n#include <sys/types.h>\n#include <sys/wait.h>\n\nint main() {\n    pid_t pid = fork();\n\n    if (pid < 0) {\n        perror("fork failed");\n        return 1;\n    } else if (pid == 0) {\n        printf("Child: My PID = %d\\n", getpid());\n        printf("Child: My Parent PID = %d\\n", getppid());\n        _exit(0);\n    } else {\n        printf("Parent: Created child with PID = %d\\n", pid);\n        printf("Parent: My PID = %d\\n", getpid());\n        wait(NULL);\n    }\n    return 0;\n}` },
      { heading: "Compile & Run", content: `gcc fork_example.c -o fork_example\n./fork_example` },
    ],
    conclusion: "Successfully created a child process and displayed child and parent PIDs using fork(), getpid(), and getppid()."
  },
  {
    title: "Experiment 5 — SJF Non-Preemptive Scheduling",
    aim: "To demonstrate Shortest Job First (Non-preemptive) CPU scheduling — computing waiting time and turnaround time.",
    theory: `Non-preemptive scheduling: once the CPU is allocated to a process, it runs to completion. SJF non-preemptive chooses the process with the smallest burst time among ready processes when the CPU becomes free.`,
    sections: [
      { heading: "SJF Non-Preemptive (C)", content: `#include <stdio.h>\ntypedef struct {\n    int pid, arrival, burst, start;\n    int completion, waiting, turnaround, done;\n} Process;\n\nint main() {\n    int n;\n    printf("Enter number of processes: ");\n    if (scanf("%d", &n) != 1) return 1;\n\n    Process p[n];\n    for (int i = 0; i < n; i++) {\n        p[i].pid = i + 1;\n        printf("Enter arrival time and burst time for P%d: ", p[i].pid);\n        scanf("%d %d", &p[i].arrival, &p[i].burst);\n        p[i].done = 0;\n    }\n\n    int completed = 0, current_time = 0;\n    float total_wait = 0, total_tat = 0;\n\n    while (completed < n) {\n        int idx = -1, min_burst = 1 << 30;\n        for (int i = 0; i < n; i++) {\n            if (!p[i].done && p[i].arrival <= current_time) {\n                if (p[i].burst < min_burst) {\n                    min_burst = p[i].burst; idx = i;\n                } else if (p[i].burst == min_burst && p[i].arrival < p[idx].arrival) {\n                    idx = i;\n                }\n            }\n        }\n        if (idx == -1) { current_time++; continue; }\n\n        p[idx].start      = current_time;\n        p[idx].completion = p[idx].start + p[idx].burst;\n        p[idx].turnaround = p[idx].completion - p[idx].arrival;\n        p[idx].waiting    = p[idx].start - p[idx].arrival;\n        p[idx].done       = 1;\n        current_time      = p[idx].completion;\n        completed++;\n        total_wait += p[idx].waiting;\n        total_tat  += p[idx].turnaround;\n    }\n\n    printf("\\nPID\\tArrival\\tBurst\\tStart\\tCompletion\\tWaiting\\tTurnaround\\n");\n    for (int i = 0; i < n; i++)\n        printf("P%d\\t%d\\t%d\\t%d\\t%d\\t\\t%d\\t%d\\n",\n            p[i].pid, p[i].arrival, p[i].burst,\n            p[i].start, p[i].completion, p[i].waiting, p[i].turnaround);\n\n    printf("\\nAverage waiting time    = %.2f\\n", total_wait / n);\n    printf("Average turnaround time = %.2f\\n", total_tat / n);\n    return 0;\n}` },
      { heading: "Compile & Run", content: `gcc sjf_nonpreemptive.c -o sjf_nonpreemptive\n./sjf_nonpreemptive` },
    ],
    conclusion: "Students implemented a non-preemptive SJF scheduling simulator, observed waiting and turnaround times, and learned how scheduling decisions affect process timing."
  },
  {
    title: "Experiment 6 — SRJF (Preemptive SJF) Scheduling",
    aim: "To implement Shortest Remaining Job First (SRJF) CPU scheduling algorithm.",
    theory: `SRJF (also called SRTF) is a preemptive CPU scheduling algorithm. The CPU is always assigned to the process with the least remaining burst time. If a new process arrives with a shorter burst time, it preempts the current process. This minimizes average waiting and turnaround time but may cause starvation.`,
    sections: [
      { heading: "SRJF Program (C)", content: `#include <stdio.h>\nint main() {\n    int n, i, time = 0, smallest, count = 0, end;\n    int at[20], bt[20], rt[20], wt[20], tat[20];\n    printf("Enter number of processes: ");\n    scanf("%d", &n);\n\n    for (i = 0; i < n; i++) {\n        printf("Enter Arrival Time of Process %d: ", i + 1);\n        scanf("%d", &at[i]);\n        printf("Enter Burst Time of Process %d: ", i + 1);\n        scanf("%d", &bt[i]);\n        rt[i] = bt[i];\n    }\n\n    rt[19] = 9999;\n    for (time = 0; count != n; time++) {\n        smallest = 19;\n        for (i = 0; i < n; i++) {\n            if (at[i] <= time && rt[i] < rt[smallest] && rt[i] > 0)\n                smallest = i;\n        }\n        rt[smallest]--;\n        if (rt[smallest] == 0) {\n            count++;\n            end = time + 1;\n            wt[smallest]  = end - at[smallest] - bt[smallest];\n            tat[smallest] = end - at[smallest];\n        }\n    }\n\n    printf("\\nProcess\\tAT\\tBT\\tWT\\tTAT\\n");\n    for (i = 0; i < n; i++)\n        printf("P%d\\t%d\\t%d\\t%d\\t%d\\n", i+1, at[i], bt[i], wt[i], tat[i]);\n\n    return 0;\n}` },

    conclusion: "The SRJF scheduling algorithm was successfully implemented. SRJF continuously selects the process with the smallest remaining burst time, making it the preemptive version of SJF."

  {
    title: "Experiment 7 — Producer-Consumer Problem",
    aim: "To implement the Producer-Consumer problem using Semaphores and Pthreads in C (simple bounded buffer).",
    theory: `The Producer-Consumer problem is a classic synchronization problem. A producer creates data and places it into a buffer; a consumer removes data. Semaphores prevent race conditions:\n• 'empty' semaphore counts empty slots.\n• 'full' semaphore counts filled slots.\n• 'mutex' ensures only one thread accesses buffer at a time.`,
    sections: [
      { heading: "Producer-Consumer (C)", content: `#include <stdio.h>\n#include <stdlib.h>\n#include <pthread.h>\n#include <semaphore.h>\n#include <unistd.h>\n\n#define BUFFER_SIZE 5\nint buffer[BUFFER_SIZE];\nint in = 0, out = 0;\nsem_t empty, full;\npthread_mutex_t mutex;\n\nvoid *producer(void *arg) {\n    for (int i = 1; i <= 10; i++) {\n        sem_wait(&empty);\n        pthread_mutex_lock(&mutex);\n        buffer[in] = i;\n        printf("Producer produced %d at index %d\\n", i, in);\n        in = (in + 1) % BUFFER_SIZE;\n        pthread_mutex_unlock(&mutex);\n        sem_post(&full);\n        sleep(1);\n    }\n    return NULL;\n}\n\nvoid *consumer(void *arg) {\n    for (int i = 1; i <= 10; i++) {\n        sem_wait(&full);\n        pthread_mutex_lock(&mutex);\n        int item = buffer[out];\n        printf("Consumer consumed %d from index %d\\n", item, out);\n        out = (out + 1) % BUFFER_SIZE;\n        pthread_mutex_unlock(&mutex);\n        sem_post(&empty);\n        sleep(2);\n    }\n    return NULL;\n}\n\nint main() {\n    pthread_t prod, cons;\n    sem_init(&empty, 0, BUFFER_SIZE);\n    sem_init(&full, 0, 0);\n    pthread_mutex_init(&mutex, NULL);\n\n    pthread_create(&prod, NULL, producer, NULL);\n    pthread_create(&cons, NULL, consumer, NULL);\n    pthread_join(prod, NULL);\n    pthread_join(cons, NULL);\n\n    sem_destroy(&empty);\n    sem_destroy(&full);\n    pthread_mutex_destroy(&mutex);\n    printf("Process completed.\\n");\n    return 0;\n}` },
      { heading: "Compile & Run", content: `gcc producer_consumer.c -o producer_consumer -lpthread\n./producer_consumer` },
    ],
    conclusion: "The Producer-Consumer problem was successfully implemented using semaphores and mutex locks. Synchronization ensured no race conditions or buffer overflows/underflows occurred."
  },
  {
    title: "Experiment 8 — Memory Placement Algorithms",
    aim: "To implement dynamic partitioning placement algorithms: Best Fit, First Fit, and Worst Fit.",
    theory: `Dynamic partitioning allocates variable-sized memory partitions to processes. Placement algorithms decide which free block to allocate:\n• First Fit — allocates the first block large enough (fast, may fragment start).\n• Best Fit — allocates the smallest sufficient block (less waste, slower).\n• Worst Fit — allocates the largest block (leaves large holes, often inefficient).`,
    sections: [
      { heading: "Best Fit (C)", content: `#include<stdio.h>\n#include<conio.h>\n#define max 25\nvoid main() {\n    int frag[max],b[max],f[max],i,j,nb,nf,temp,lowest=10000;\n    static int bf[max],ff[max];\n    clrscr();\n    printf("\\nEnter the number of blocks: "); scanf("%d",&nb);\n    printf("Enter the number of files: ");  scanf("%d",&nf);\n    printf("\\nEnter the size of the blocks:\\n");\n    for(i=1;i<=nb;i++) { printf("Block %d:",i); scanf("%d",&b[i]); }\n    printf("Enter the size of the files:\\n");\n    for(i=1;i<=nf;i++) { printf("File %d:",i); scanf("%d",&f[i]); }\n\n    for(i=1;i<=nf;i++) {\n        for(j=1;j<=nb;j++) {\n            if(bf[j]!=1) {\n                temp=b[j]-f[i];\n                if(temp>=0 && lowest>temp) { ff[i]=j; lowest=temp; }\n            }\n        }\n        frag[i]=lowest; bf[ff[i]]=1; lowest=10000;\n    }\n    printf("\\nFile No\\tFile Size\\tBlock No\\tBlock Size\\tFragment");\n    for(i=1;i<=nf && ff[i]!=0;i++)\n        printf("\\n%d\\t\\t%d\\t\\t%d\\t\\t%d\\t\\t%d",i,f[i],ff[i],b[ff[i]],frag[i]);\n    getch();\n}` },
      { heading: "First Fit (C)", content: `#include<stdio.h>\n#include<conio.h>\n#define max 25\nvoid main() {\n    int frag[max],b[max],f[max],i,j,nb,nf,temp;\n    static int bf[max],ff[max];\n    clrscr();\n    printf("\\nMemory Management Scheme - First Fit");\n    printf("\\nEnter the number of blocks: "); scanf("%d",&nb);\n    printf("Enter the number of files: ");  scanf("%d",&nf);\n    printf("\\nEnter the size of the blocks:\\n");\n    for(i=1;i<=nb;i++) { printf("Block %d:",i); scanf("%d",&b[i]); }\n    printf("Enter the size of the files:\\n");\n    for(i=1;i<=nf;i++) { printf("File %d:",i); scanf("%d",&f[i]); }\n\n    for(i=1;i<=nf;i++) {\n        for(j=1;j<=nb;j++) {\n            if(bf[j]!=1) {\n                temp=b[j]-f[i];\n                if(temp>=0) { ff[i]=j; frag[i]=temp; bf[j]=1; break; }\n            }\n        }\n    }\n    printf("\\nFile No\\tFile Size\\tBlock No\\tBlock Size\\tFragment");\n    for(i=1;i<=nf && ff[i]!=0;i++)\n        printf("\\n%d\\t\\t%d\\t\\t%d\\t\\t%d\\t\\t%d",i,f[i],ff[i],b[ff[i]],frag[i]);\n    getch();\n}` },
      { heading: "Worst Fit (C)", content: `#include<stdio.h>\n#include<conio.h>\n#define max 25\nvoid main() {\n    int frag[max],b[max],f[max],i,j,nb,nf,temp,highest=0;\n    static int bf[max],ff[max];\n    clrscr();\n    printf("\\nMemory Management Scheme - Worst Fit");\n    printf("\\nEnter the number of blocks: "); scanf("%d",&nb);\n    printf("Enter the number of files: ");  scanf("%d",&nf);\n    printf("\\nEnter the size of the blocks:\\n");\n    for(i=1;i<=nb;i++) { printf("Block %d:",i); scanf("%d",&b[i]); }\n    printf("Enter the size of the files:\\n");\n    for(i=1;i<=nf;i++) { printf("File %d:",i); scanf("%d",&f[i]); }\n\n    for(i=1;i<=nf;i++) {\n        for(j=1;j<=nb;j++) {\n            if(bf[j]!=1) {\n                temp=b[j]-f[i];\n                if(temp>=0 && highest<temp) { ff[i]=j; highest=temp; }\n            }\n        }\n        frag[i]=highest; bf[ff[i]]=1; highest=0;\n    }\n    printf("\\nFile No\\tFile Size\\tBlock No\\tBlock Size\\tFragment");\n    for(i=1;i<=nf;i++)\n        printf("\\n%d\\t\\t%d\\t\\t%d\\t\\t%d\\t\\t%d",i,f[i],ff[i],b[ff[i]],frag[i]);\n    getch();\n}` },
    ],
    conclusion: "Best Fit, First Fit, and Worst Fit dynamic memory partitioning algorithms were implemented and their behavior on memory fragmentation was observed."
  },
  {
    title: "Experiment 9 — Page Replacement: FIFO & LRU",
    aim: "To write and execute a program to implement page replacement policies: FIFO and LRU.",
    theory: `Page replacement algorithms decide which page to evict when a page fault occurs and memory is full. FIFO replaces the oldest loaded page. LRU replaces the page not used for the longest time (principle of locality of reference).`,
    sections: [
      { heading: "FIFO Page Replacement (C)", content: `#include<stdio.h>\n#include<conio.h>\nmain() {\n    int i,j,k,f,pf=0,count=0,rs[25],m[10],n;\n    clrscr();\n    printf("\\nEnter the length of reference string: "); scanf("%d",&n);\n    printf("\\nEnter the reference string: ");\n    for(i=0;i<n;i++) scanf("%d",&rs[i]);\n    printf("\\nEnter no. of frames: "); scanf("%d",&f);\n    for(i=0;i<f;i++) m[i]=-1;\n    printf("\\nThe Page Replacement Process is:\\n");\n    for(i=0;i<n;i++) {\n        for(k=0;k<f;k++) if(m[k]==rs[i]) break;\n        if(k==f) { m[count++]=rs[i]; pf++; }\n        for(j=0;j<f;j++) printf("\\t%d",m[j]);\n        if(k==f) printf("\\tPF No. %d",pf);\n        printf("\\n");\n        if(count==f) count=0;\n    }\n    printf("\\nThe number of Page Faults using FIFO are %d",pf);\n    getch();\n}` },
      { heading: "LRU Page Replacement (C)", content: `#include<stdio.h>\n#include<conio.h>\nmain() {\n    int i,j,min,rs[25],m[10],count[10],flag[25],n,f,pf=0,next=1;\n    clrscr();\n    printf("Enter the length of reference string: "); scanf("%d",&n);\n    printf("Enter the reference string: ");\n    for(i=0;i<n;i++) { scanf("%d",&rs[i]); flag[i]=0; }\n    printf("Enter the number of frames: "); scanf("%d",&f);\n    for(i=0;i<f;i++) { count[i]=0; m[i]=-1; }\n    printf("\\nThe Page Replacement process is:\\n");\n    for(i=0;i<n;i++) {\n        for(j=0;j<f;j++) {\n            if(m[j]==rs[i]) { flag[i]=1; count[j]=next; next++; }\n        }\n        if(flag[i]==0) {\n            if(i<f) { m[i]=rs[i]; count[i]=next; next++; }\n            else {\n                min=0;\n                for(j=1;j<f;j++) if(count[min]>count[j]) min=j;\n                m[min]=rs[i]; count[min]=next; next++;\n            }\n            pf++;\n        }\n        for(j=0;j<f;j++) printf("%d\\t",m[j]);\n        if(flag[i]==0) printf("PF No. -- %d",pf);\n        printf("\\n");\n    }\n    printf("\\nThe number of page faults using LRU are %d",pf);\n    getch();\n}` },
    ],
    conclusion: "FIFO and LRU page replacement algorithms were studied, implemented, and their effect on page faults observed."
  },
  {
    title: "Experiment 10 — Disk Scheduling: FCFS, SCAN, C-SCAN",
    aim: "To implement Disk Scheduling algorithms: FCFS, SCAN and C-SCAN.",
    theory: `Disk scheduling decides the order to service I/O requests to minimize seek time.\n• FCFS — requests served in arrival order (simple, may have high seek time).\n• SCAN — disk arm moves in one direction servicing requests, reverses at end (elevator algorithm).\n• C-SCAN — like SCAN but only services in one direction, jumps back to start.`,
    sections: [
      { heading: "FCFS Disk Scheduling (C)", content: `#include<stdio.h>\nint main() {\n    int queue[20],n,head,i,j,k,seek=0,max,diff;\n    float avg;\n    printf("Enter the max range of disk\\n"); scanf("%d",&max);\n    printf("Enter the size of queue request\\n"); scanf("%d",&n);\n    printf("Enter the queue of disk positions to be read\\n");\n    for(i=1;i<=n;i++) scanf("%d",&queue[i]);\n    printf("Enter the initial head position\\n"); scanf("%d",&head);\n    queue[0]=head;\n    for(j=0;j<=n-1;j++) {\n        diff=abs(queue[j+1]-queue[j]);\n        seek+=diff;\n        printf("Disk head moves from %d to %d with seek %d\\n",queue[j],queue[j+1],diff);\n    }\n    printf("Total seek time is %d\\n",seek);\n    avg=seek/(float)n;\n    printf("Average seek time is %f\\n",avg);\n    return 0;\n}` },
      { heading: "SCAN Disk Scheduling (C)", content: `#include<stdio.h>\nint main() {\n    int queue[20],n,head,i,j,seek=0,max,diff,temp;\n    int queue1[20],queue2[20],temp1=0,temp2=0;\n    float avg;\n    printf("Enter the max range of disk\\n"); scanf("%d",&max);\n    printf("Enter the initial head position\\n"); scanf("%d",&head);\n    printf("Enter the size of queue request\\n"); scanf("%d",&n);\n    printf("Enter the queue of disk positions to be read\\n");\n    for(i=1;i<=n;i++) {\n        scanf("%d",&temp);\n        if(temp>=head) { queue1[temp1]=temp; temp1++; }\n        else           { queue2[temp2]=temp; temp2++; }\n    }\n    // Sort queue1 ascending\n    for(i=0;i<temp1-1;i++)\n        for(j=i+1;j<temp1;j++)\n            if(queue1[i]>queue1[j]) { temp=queue1[i]; queue1[i]=queue1[j]; queue1[j]=temp; }\n    // Sort queue2 descending\n    for(i=0;i<temp2-1;i++)\n        for(j=i+1;j<temp2;j++)\n            if(queue2[i]<queue2[j]) { temp=queue2[i]; queue2[i]=queue2[j]; queue2[j]=temp; }\n    for(i=1,j=0;j<temp1;i++,j++) queue[i]=queue1[j];\n    queue[i]=max;\n    for(i=temp1+2,j=0;j<temp2;i++,j++) queue[i]=queue2[j];\n    queue[0]=head;\n    for(j=0;j<=n+1;j++) {\n        diff=abs(queue[j+1]-queue[j]);\n        seek+=diff;\n        printf("Disk head moves from %d to %d with seek %d\\n",queue[j],queue[j+1],diff);\n    }\n    printf("Total seek time is %d\\n",seek);\n    avg=seek/(float)n;\n    printf("Average seek time is %f\\n",avg);\n    return 0;\n}` },
      { heading: "C-SCAN Disk Scheduling (C)", content: `#include<stdio.h>\n#include<stdlib.h>\nint main() {\n    int queue[20],n,head,i,j,seek=0,max,diff,temp;\n    int queue1[20],queue2[20],temp1=0,temp2=0;\n    float avg;\n    printf("Enter the max range of disk\\n"); scanf("%d",&max);\n    printf("Enter the initial head position\\n"); scanf("%d",&head);\n    printf("Enter the size of queue request\\n"); scanf("%d",&n);\n    printf("Enter the queue of disk positions\\n");\n    for(i=1;i<=n;i++) {\n        scanf("%d",&temp);\n        if(temp>=head) { queue1[temp1]=temp; temp1++; }\n        else           { queue2[temp2]=temp; temp2++; }\n    }\n    // Sort both ascending\n    for(i=0;i<temp1-1;i++)\n        for(j=i+1;j<temp1;j++)\n            if(queue1[i]>queue1[j]) { temp=queue1[i]; queue1[i]=queue1[j]; queue1[j]=temp; }\n    for(i=0;i<temp2-1;i++)\n        for(j=i+1;j<temp2;j++)\n            if(queue2[i]>queue2[j]) { temp=queue2[i]; queue2[i]=queue2[j]; queue2[j]=temp; }\n    // Service right side, go to max, jump to 0, service left side\n    for(i=1,j=0;j<temp1;i++,j++) queue[i]=queue1[j];\n    queue[i++]=max; queue[i++]=0;\n    for(j=0;j<temp2;i++,j++) queue[i]=queue2[j];\n    queue[0]=head;\n    for(j=0;j<=n+1;j++) {\n        diff=abs(queue[j+1]-queue[j]);\n        seek+=diff;\n        printf("Disk head moves from %d to %d with seek %d\\n",queue[j],queue[j+1],diff);\n    }\n    printf("Total seek time is %d\\n",seek);\n    avg=seek/(float)n;\n    printf("Average seek time is %f\\n",avg);\n    return 0;\n}` },
    ],
    conclusion: "FCFS, SCAN, and C-SCAN disk scheduling algorithms were successfully implemented. Each algorithm shows different seek time characteristics based on head movement strategy."

// Populate list
const list = document.getElementById('exp-list');
experiments.forEach((exp, i) => {
  const li = document.createElement('li');
  const btn = document.createElement('button');
  btn.innerHTML = `<span class="exp-num">0${i+1}</span>${exp.title.replace(/Experiment \d+ — /, '')}`;
  btn.onclick = () => openExp(i);
  li.appendChild(btn);
  list.appendChild(li);
});

function openDrawer() {
  document.getElementById('exp-drawer').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  document.getElementById('exp-drawer').classList.remove('open');
  document.body.style.overflow = '';
}

function closeDrawerOutside(e) {
  if (e.target === document.getElementById('exp-drawer')) closeDrawer();
}

function openExp(idx) {
  closeDrawer();
  const exp = experiments[idx];
  document.getElementById('exp-page-title').textContent = exp.title;

  let html = '';

  if (exp.aim) {
    html += `<h2>Aim</h2><p>${exp.aim}</p>`;
  }
  if (exp.theory) {
    html += `<h2>Theory</h2><p>${exp.theory.replace(/\n/g,'<br>')}</p>`;
  }

  exp.sections.forEach(sec => {
    html += `<h2>${sec.heading}</h2>`;
    html += `<div class="code-block">
      <button class="copy-btn" onclick="copyCode(this)">Copy</button>
      <pre>${escHtml(sec.content)}</pre>
    </div>`;
  });

  if (exp.conclusion) {
    html += `<h2>Conclusion</h2><p>${exp.conclusion}</p>`;
  }

  document.getElementById('exp-page-body').innerHTML = html;
  document.getElementById('exp-page').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePage() {
  document.getElementById('exp-page').classList.remove('open');
  document.body.style.overflow = '';
  openDrawer();
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyCode(btn) {
  const code = btn.nextElementSibling.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  });
}
