<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serial Cheaters</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #00cccc;
    --red-bright: #00ffff;
    --red-glow: #00ffff88;
    --bg: #050508;
    --surface: #0c0c12;
    --border: #001a1a;
    --text: #e8e8e8;
    --muted: #667;
    --code-bg: #07070d;
    --gold: #c9a84c;
    --gold-bright: #f0c060;
    --gold-glow: #f0c06055;
    --gold-border: #3a2800;
  }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; overflow-x: hidden; }

  /* ── HERO ── */
  #hero {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.35;
    z-index: 0;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 15%, #050508dd 75%);
    z-index: 1;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
  }

  .hero-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(2.8rem, 8vw, 7rem);
    font-weight: 900;
    color: var(--red-bright);
    text-shadow:
      0 0 10px #00ffff,
      0 0 30px var(--red-glow),
      0 0 70px var(--red-glow),
      0 0 140px #00ffff33,
      2px 2px 0 #003333,
      4px 4px 0 #002222;
    letter-spacing: 0.04em;
    line-height: 1.1;
    cursor: default;
    word-break: break-word;
    padding: 0 0.5rem;
    transition: all 0.3s ease;
    animation: flicker 6s infinite;
  }

  .hero-title:hover {
    text-shadow:
      0 0 10px #00ffff,
      0 0 40px #00ffff,
      0 0 90px var(--red-glow),
      0 0 180px #00ffff44,
      0 0 260px #00ffff22,
      2px 2px 0 #004444,
      5px 5px 0 #003333;
    transform: scale(1.04) skewX(-1deg);
    color: #66ffff;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.85; }
    97% { opacity: 1; }
    98% { opacity: 0.7; }
    99% { opacity: 1; }
  }

  .hero-sub {
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .btn-experiments {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.9rem 2.4rem;
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red-bright);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.95rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-experiments::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--red);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: -1;
  }

  .btn-experiments:hover::before { transform: translateX(0); }
  .btn-experiments:hover { color: #fff; border-color: var(--red-bright); box-shadow: 0 0 20px var(--red-glow); }

  /* ── EXPERIMENTS DRAWER ── */
  #exp-drawer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000000cc;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.2s ease;
  }

  #exp-drawer.open { display: flex; align-items: center; justify-content: center; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .drawer-panel {
    background: var(--surface);
    border: 1px solid var(--gold-border);
    width: min(420px, 92vw);
    max-height: 80vh;
    overflow-y: auto;
    padding: 2rem;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes slideUpSheet { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--gold-border);
    padding-bottom: 1rem;
  }

  .drawer-header h2 {
    font-family: 'Cinzel Decorative', serif;
    font-size: 1.1rem;
    color: var(--gold-bright);
    letter-spacing: 0.05em;
    text-shadow: 0 0 12px var(--gold-glow);
  }

  .close-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
    transition: color 0.2s;
  }
  .close-btn:hover { color: var(--red-bright); }

  .exp-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }

  .exp-list li button {
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid #1a1a1a;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.88rem;
    padding: 0.8rem 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .exp-list li button .exp-num {
    color: var(--gold);
    min-width: 2.5ch;
    font-size: 0.75rem;
  }

  .exp-list li button:hover {
    border-color: var(--gold);
    color: var(--gold-bright);
    background: #1a0f00;
    box-shadow: inset 3px 0 0 var(--gold);
  }

  /* ── EXP PAGE ── */
  #exp-page {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: var(--bg);
    overflow-y: auto;
    animation: fadeIn 0.2s ease;
  }

  #exp-page.open { display: block; }

  .exp-topbar {
    position: sticky;
    top: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--gold-border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    z-index: 10;
  }

  .back-btn {
    background: none;
    border: 1px solid var(--gold-border);
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.1em;
  }
  .back-btn:hover { border-color: var(--gold); color: var(--gold-bright); }

  .exp-topbar h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.95rem;
    color: var(--gold-bright);
    text-shadow: 0 0 10px var(--gold-glow);
    flex: 1;
  }

  .exp-body {
    max-width: 860px;
    margin: 0 auto;
    padding: 2.5rem 2rem 4rem;
  }

  .exp-body h2 {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.85rem;
    color: var(--gold-bright);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin: 2rem 0 0.6rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--gold-border);
    text-shadow: 0 0 8px var(--gold-glow);
  }

  .exp-body p, .exp-body li {
    font-size: 0.88rem;
    line-height: 1.8;
    color: #bbb;
    margin-bottom: 0.4rem;
  }

  .exp-body ul { padding-left: 1.2rem; margin-bottom: 0.8rem; }

  .code-block {
    position: relative;
    margin: 1rem 0;
    background: var(--code-bg);
    border: 1px solid #1a1000;
    border-left: 3px solid var(--gold);
  }

  .code-block pre {
    padding: 1.2rem 1rem;
    overflow-x: auto;
    font-size: 0.82rem;
    line-height: 1.65;
    color: #d4d4d4;
    white-space: pre;
    font-family: 'Share Tech Mono', monospace;
  }

  .copy-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    background: #100a00;
    border: 1px solid var(--gold-border);
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .copy-btn:hover { border-color: var(--gold); color: var(--gold-bright); }
  .copy-btn.copied { border-color: #00aa44; color: #00cc55; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--gold-border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  /* ── SUBJECT CARDS ── */
  .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

  .subject-card {
    background: #0d0d08;
    border: 1px solid var(--gold-border);
    padding: 1.4rem 1rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .subject-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a0f0000, #1a0f0088);
    opacity: 0;
    transition: opacity 0.25s;
  }

  .subject-card:hover { border-color: var(--gold-bright); transform: translateY(-3px); box-shadow: 0 6px 24px var(--gold-glow), inset 0 0 0 1px var(--gold); }
  .subject-card:hover::before { opacity: 1; }

  .subject-card .s-icon { font-size: 1.8rem; margin-bottom: 0.6rem; display: block; }

  .subject-card .s-name {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.68rem;
    color: var(--gold-bright);
    letter-spacing: 0.08em;
    text-shadow: 0 0 8px var(--gold-glow);
    line-height: 1.4;
    position: relative;
  }

  .subject-card .s-count {
    display: block;
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 0.3rem;
    letter-spacing: 0.05em;
  }

  /* back arrow in exp list header */
  .drawer-back {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    padding: 0 0.3rem 0 0;
    transition: color 0.2s;
    letter-spacing: 0.05em;
  }
  .drawer-back:hover { color: var(--gold-bright); }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    .hero-title {
      font-size: clamp(1.9rem, 12.5vw, 3rem);
      letter-spacing: 0.01em;
      line-height: 1.18;
      padding: 0 0.8rem;
    }
    .hero-title:hover { transform: none; }
    .hero-content { gap: 1.6rem; padding: 0 1rem; width: 100%; }
    .hero-sub { font-size: 0.68rem; letter-spacing: 0.18em; }
    .btn-experiments { padding: 0.85rem 1.6rem; font-size: 0.8rem; letter-spacing: 0.1em; min-height: 48px; }

    /* drawer slides up from bottom */
    #exp-drawer.open { align-items: flex-end; }
    .drawer-panel {
      width: 100vw;
      max-height: 88vh;
      border-left: none;
      border-right: none;
      border-bottom: none;
      padding: 1.4rem 1rem 2rem;
      animation-name: slideUpSheet;
    }
    .subject-grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .subject-card { padding: 1.1rem 0.6rem; }
    .subject-card .s-icon { font-size: 1.5rem; }
    .subject-card .s-name { font-size: 0.6rem; }
    .drawer-header h2 { font-size: 0.92rem; }
    .exp-list li button { font-size: 0.8rem; padding: 0.9rem 0.75rem; min-height: 48px; line-height: 1.4; }

    /* exp page */
    .exp-topbar { padding: 0.7rem 0.9rem; flex-wrap: wrap; gap: 0.4rem; }
    .exp-topbar h1 { font-size: 0.68rem; width: 100%; text-align: center; padding-top: 0.2rem; order: 1; }
    .back-btn { order: 0; font-size: 0.72rem; min-height: 36px; padding: 0.35rem 0.9rem; }
    .exp-body { padding: 1.2rem 0.9rem 5rem; }
    .exp-body h2 { font-size: 0.68rem; letter-spacing: 0.08em; margin-top: 1.6rem; }
    .exp-body p, .exp-body li { font-size: 0.8rem; line-height: 1.72; }
    .code-block pre { font-size: 0.68rem; padding: 2.8rem 0.75rem 0.9rem; line-height: 1.55; }
    .copy-btn { font-size: 0.62rem; padding: 0.28rem 0.55rem; top: 0.4rem; right: 0.4rem; }
  }

  @media (hover: none) {
    .btn-experiments::before { display: none; }
    .btn-experiments:active { background: var(--red); color: #050508; }
    .subject-card:active { border-color: var(--gold-bright); background: #1a0f00; }
    .exp-list li button:active { background: #1a0f00; border-color: var(--gold); color: var(--gold-bright); box-shadow: inset 3px 0 0 var(--gold); }
    .back-btn:active { border-color: var(--gold); color: var(--gold-bright); }
    .copy-btn:active { border-color: var(--gold); color: var(--gold-bright); }
  }
</style>
</head>
<body>

<!-- ── HERO ── -->
<section id="hero">
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="bg.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div>
      <p class="hero-sub">↯ &nbsp; lab codes &nbsp; ↯</p>
    </div>
    <h1 class="hero-title">Serial<br>Cheaters</h1>
    <button class="btn-experiments" onclick="openDrawer()">
      &#x2665; &nbsp; Subjects
    </button>
  </div>
</section>

<!-- ── SUBJECTS DRAWER ── -->
<div id="exp-drawer" onclick="closeDrawerOutside(event)">
  <div class="drawer-panel">
    <div class="drawer-header">
      <h2 id="drawer-title">Subjects</h2>
      <button class="close-btn" onclick="closeDrawer()">✕</button>
    </div>
    <div id="subject-list-wrap">
      <div class="subject-grid" id="subject-list"></div>
    </div>
    <ul class="exp-list" id="exp-list" style="display:none"></ul>
  </div>
</div>

<!-- ── EXP PAGE ── -->
<div id="exp-page">
  <div class="exp-topbar">
    <button class="back-btn" onclick="closePage()">← Back</button>
    <h1 id="exp-page-title"></h1>
  </div>
  <div class="exp-body" id="exp-page-body"></div>
</div>

<script>
// All code stored as regular strings to avoid backtick/script-tag conflicts
function d(s){ return s; }

const subjects = [
  {
    id: 'os',
    name: 'Operating Systems',
    icon: '\u2699\uFE0F',
    experiments: [
      {
        title: "Experiment 1 \u2014 Basic Linux Commands & System Calls",
        aim: "To explore the usage of basic Linux commands and system calls for file, directory, and process management.",
        theory: "Linux provides powerful tools for managing files, directories, and processes. System calls allow low-level communication between programs and the kernel, enabling file operations such as open(), read(), write(), and close(), as well as process identification using getpid(), getuid(), etc.",
        sections: [
          { heading: "Basic Linux Commands", content: "mkdir experiment1\ncd experiment1\necho \"Hello Linux\" > file1.txt\ncat file1.txt\nls -l\nchmod 755 file1.txt\ngrep Hello file1.txt\ntouch fruits.txt\nsort fruits.txt\nps -aux" },
          { heading: "System Calls Program (C)", content: "#include <fcntl.h>\n#include <unistd.h>\n#include <stdio.h>\n\nint main() {\n    int fd = open(\"demo.txt\", O_CREAT | O_RDWR, 0644);\n    write(fd, \"System Call Demo\", 17);\n\n    char buffer[50];\n    lseek(fd, 0, SEEK_SET);\n    read(fd, buffer, 17);\n\n    printf(\"File Content: %s\\n\", buffer);\n    close(fd);\n\n    printf(\"Process ID: %d\\n\", getpid());\n    printf(\"User ID: %d\\n\", getuid());\n    return 0;\n}" },
          { heading: "Compile & Run", content: "gcc syscalls.c -o syscalls\n./syscalls" }
        ],
        conclusion: "Students successfully explored essential Linux commands and system calls, gaining practical understanding of file handling, directory management, and process interaction within the Linux operating system."
      },
      {
        title: "Experiment 2 \u2014 Shell Scripts",
        aim: "To study and implement the shell scripts.",
        theory: "Shell scripts are short programs written in a shell programming language and interpreted by a shell process. They are extremely useful for automating tasks on Linux and other Unix-like operating systems. The default shell on Linux is bash.",
        sections: [
          { heading: "Hello World Shell Script", content: "#!/bin/bash\necho \"HELLO WORLD\"" },
          { heading: "Top 10 Processes by Memory", content: "ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%mem | head" },
          { heading: "Current User & Logname", content: "echo \"Hi, $USER! Let us be friends.\"\necho \"Hello, $LOGNAME!\"" },
          { heading: "OS Version & Kernel Info", content: "uname -a\nuname -r\ncat /proc/version\ncat /etc/issue" }
        ],
        conclusion: "Thus we have studied and implemented shell script programs successfully."
      },
      {
        title: "Experiment 3 \u2014 Linux Commands using Kernel APIs",
        aim: "Implementation of Basic Linux Commands using Kernel APIs.",
        theory: "Linux commands are user-level programs that interact with the OS through kernel system calls. Commands such as ls, cp, and mv internally use open(), read(), write(), close(), rename(), and getdents() to perform file operations.",
        sections: [
          { heading: "ls Implementation (C)", content: "#include <stdio.h>\n#include <fcntl.h>\n#include <unistd.h>\n#include <sys/syscall.h>\n\nstruct linux_dirent {\n    long d_ino;\n    off_t d_off;\n    unsigned short d_reclen;\n    char d_name[];\n};\n\nint main() {\n    int fd = open(\".\", O_RDONLY);\n    char buf[1024];\n    int nread;\n    while ((nread = syscall(SYS_getdents, fd, buf, sizeof(buf))) > 0) {\n        int pos = 0;\n        while (pos < nread) {\n            struct linux_dirent *d = (struct linux_dirent *)(buf + pos);\n            printf(\"%s\\n\", d->d_name);\n            pos += d->d_reclen;\n        }\n    }\n    close(fd);\n    return 0;\n}" },
          { heading: "cp Implementation (C)", content: "#include <stdio.h>\n#include <fcntl.h>\n#include <unistd.h>\n\nint main(int argc, char *argv[]) {\n    int src = open(argv[1], O_RDONLY);\n    int dest = open(argv[2], O_CREAT | O_WRONLY, 0644);\n    char buf[100];\n    int n;\n    while ((n = read(src, buf, sizeof(buf))) > 0) {\n        write(dest, buf, n);\n    }\n    close(src);\n    close(dest);\n    printf(\"File copied successfully\\n\");\n    return 0;\n}" },
          { heading: "mv Implementation (C)", content: "#include <stdio.h>\n\nint main(int argc, char *argv[]) {\n    if (rename(argv[1], argv[2]) == 0)\n        printf(\"File moved successfully\\n\");\n    else\n        perror(\"Error\");\n    return 0;\n}" },
          { heading: "Compile & Run", content: "gcc ls.c -o ls_cmd\ngcc cp.c -o cp_cmd\ngcc mv.c -o mv_cmd\n\n./ls_cmd\n./cp_cmd source.txt dest.txt\n./mv_cmd old.txt new.txt" }
        ],
        conclusion: "This experiment demonstrated the internal working of basic Linux commands using kernel system calls."
      },
      {
        title: "Experiment 4 \u2014 fork(), getpid(), getppid()",
        aim: "Create a child process using fork(), display PID of parent & child using getpid() and getppid().",
        theory: "fork() creates a new child process. The child receives 0 as return value, while the parent receives the PID of the child. getpid() returns the current process ID and getppid() returns the parent process ID.",
        sections: [
          { heading: "fork() Program (C)", content: "#include <stdio.h>\n#include <unistd.h>\n#include <sys/types.h>\n#include <sys/wait.h>\n\nint main() {\n    pid_t pid = fork();\n\n    if (pid < 0) {\n        perror(\"fork failed\");\n        return 1;\n    } else if (pid == 0) {\n        printf(\"Child: My PID = %d\\n\", getpid());\n        printf(\"Child: My Parent PID = %d\\n\", getppid());\n        _exit(0);\n    } else {\n        printf(\"Parent: Created child with PID = %d\\n\", pid);\n        printf(\"Parent: My PID = %d\\n\", getpid());\n        wait(NULL);\n    }\n    return 0;\n}" },
          { heading: "Compile & Run", content: "gcc fork_example.c -o fork_example\n./fork_example" }
        ],
        conclusion: "Successfully created a child process and displayed child and parent PIDs using fork(), getpid(), and getppid()."
      },
      {
        title: "Experiment 5 \u2014 SJF Non-Preemptive Scheduling",
        aim: "To demonstrate Shortest Job First (Non-preemptive) CPU scheduling.",
        theory: "Non-preemptive scheduling: once the CPU is allocated to a process, it runs to completion. SJF non-preemptive chooses the process with the smallest burst time among ready processes when the CPU becomes free.",
        sections: [
          { heading: "SJF Non-Preemptive (C)", content: "#include <stdio.h>\ntypedef struct {\n    int pid, arrival, burst, start;\n    int completion, waiting, turnaround, done;\n} Process;\n\nint main() {\n    int n;\n    printf(\"Enter number of processes: \");\n    if (scanf(\"%d\", &n) != 1) return 1;\n\n    Process p[n];\n    for (int i = 0; i < n; i++) {\n        p[i].pid = i + 1;\n        printf(\"Enter arrival time and burst time for P%d: \", p[i].pid);\n        scanf(\"%d %d\", &p[i].arrival, &p[i].burst);\n        p[i].done = 0;\n    }\n\n    int completed = 0, current_time = 0;\n    float total_wait = 0, total_tat = 0;\n\n    while (completed < n) {\n        int idx = -1, min_burst = 1 << 30;\n        for (int i = 0; i < n; i++) {\n            if (!p[i].done && p[i].arrival <= current_time) {\n                if (p[i].burst < min_burst) { min_burst = p[i].burst; idx = i; }\n                else if (p[i].burst == min_burst && p[i].arrival < p[idx].arrival) idx = i;\n            }\n        }\n        if (idx == -1) { current_time++; continue; }\n        p[idx].start = current_time;\n        p[idx].completion = p[idx].start + p[idx].burst;\n        p[idx].turnaround = p[idx].completion - p[idx].arrival;\n        p[idx].waiting = p[idx].start - p[idx].arrival;\n        p[idx].done = 1; current_time = p[idx].completion; completed++;\n        total_wait += p[idx].waiting; total_tat += p[idx].turnaround;\n    }\n\n    printf(\"\\nPID\\tArrival\\tBurst\\tStart\\tCompletion\\tWaiting\\tTurnaround\\n\");\n    for (int i = 0; i < n; i++)\n        printf(\"P%d\\t%d\\t%d\\t%d\\t%d\\t\\t%d\\t%d\\n\",\n            p[i].pid,p[i].arrival,p[i].burst,p[i].start,p[i].completion,p[i].waiting,p[i].turnaround);\n    printf(\"\\nAvg waiting = %.2f\\nAvg turnaround = %.2f\\n\", total_wait/n, total_tat/n);\n    return 0;\n}" },
          { heading: "Compile & Run", content: "gcc sjf.c -o sjf\n./sjf" }
        ],
        conclusion: "Students implemented a non-preemptive SJF scheduling simulator and observed waiting and turnaround times."

        sections: [

        title: "Experiment 7 \u2014 Producer-Consumer Problem",
        aim: "To implement the Producer-Consumer problem using Semaphores and Pthreads in C.",
        theory: "The Producer-Consumer problem is a classic synchronization problem. Semaphores prevent race conditions: 'empty' counts empty slots, 'full' counts filled slots, 'mutex' ensures exclusive buffer access.",
        sections: [
          { heading: "Producer-Consumer (C)", content: "#include <stdio.h>\n#include <stdlib.h>\n#include <pthread.h>\n#include <semaphore.h>\n#include <unistd.h>\n\n#define BUFFER_SIZE 5\nint buffer[BUFFER_SIZE], in = 0, out = 0;\nsem_t empty, full;\npthread_mutex_t mutex;\n\nvoid *producer(void *arg) {\n    for (int i = 1; i <= 10; i++) {\n        sem_wait(&empty);\n        pthread_mutex_lock(&mutex);\n        buffer[in] = i;\n        printf(\"Produced %d at %d\\n\", i, in);\n        in = (in + 1) % BUFFER_SIZE;\n        pthread_mutex_unlock(&mutex);\n        sem_post(&full);\n        sleep(1);\n    }\n    return NULL;\n}\n\nvoid *consumer(void *arg) {\n    for (int i = 1; i <= 10; i++) {\n        sem_wait(&full);\n        pthread_mutex_lock(&mutex);\n        int item = buffer[out];\n        printf(\"Consumed %d from %d\\n\", item, out);\n        out = (out + 1) % BUFFER_SIZE;\n        pthread_mutex_unlock(&mutex);\n        sem_post(&empty);\n        sleep(2);\n    }\n    return NULL;\n}\n\nint main() {\n    pthread_t prod, cons;\n    sem_init(&empty, 0, BUFFER_SIZE);\n    sem_init(&full, 0, 0);\n    pthread_mutex_init(&mutex, NULL);\n    pthread_create(&prod, NULL, producer, NULL);\n    pthread_create(&cons, NULL, consumer, NULL);\n    pthread_join(prod, NULL);\n    pthread_join(cons, NULL);\n    sem_destroy(&empty); sem_destroy(&full);\n    pthread_mutex_destroy(&mutex);\n    printf(\"Done.\\n\");\n    return 0;\n}" },
          { heading: "Compile & Run", content: "gcc producer_consumer.c -o pc -lpthread\n./pc" }

        title: "Experiment 9 \u2014 Page Replacement: FIFO & LRU",
        aim: "To implement page replacement policies: FIFO and LRU.",
        theory: "Page replacement algorithms decide which page to evict when a page fault occurs. FIFO replaces the oldest page. LRU replaces the least recently used page.",
        sections: [
          { heading: "FIFO Page Replacement (C)", content: "#include<stdio.h>\n#include<conio.h>\nmain() {\n    int i,j,k,f,pf=0,count=0,rs[25],m[10],n;\n    clrscr();\n    printf(\"Reference string length: \"); scanf(\"%d\",&n);\n    printf(\"Reference string: \");\n    for(i=0;i<n;i++) scanf(\"%d\",&rs[i]);\n    printf(\"Frames: \"); scanf(\"%d\",&f);\n    for(i=0;i<f;i++) m[i]=-1;\n    for(i=0;i<n;i++) {\n        for(k=0;k<f;k++) if(m[k]==rs[i]) break;\n        if(k==f) { m[count++]=rs[i]; pf++; }\n        for(j=0;j<f;j++) printf(\"\\t%d\",m[j]);\n        if(k==f) printf(\"\\tPF %d\",pf);\n        printf(\"\\n\");\n        if(count==f) count=0;\n    }\n    printf(\"Page Faults (FIFO): %d\",pf);\n    getch();\n}" },
          { heading: "LRU Page Replacement (C)", content: "#include<stdio.h>\n#include<conio.h>\nmain() {\n    int i,j,min,rs[25],m[10],count[10],flag[25],n,f,pf=0,next=1;\n    clrscr();\n    printf(\"Reference string length: \"); scanf(\"%d\",&n);\n    printf(\"Reference string: \");\n    for(i=0;i<n;i++) { scanf(\"%d\",&rs[i]); flag[i]=0; }\n    printf(\"Frames: \"); scanf(\"%d\",&f);\n    for(i=0;i<f;i++) { count[i]=0; m[i]=-1; }\n    for(i=0;i<n;i++) {\n        for(j=0;j<f;j++)\n            if(m[j]==rs[i]) { flag[i]=1; count[j]=next; next++; }\n        if(flag[i]==0) {\n            if(i<f) { m[i]=rs[i]; count[i]=next; next++; }\n            else {\n                min=0;\n                for(j=1;j<f;j++) if(count[min]>count[j]) min=j;\n                m[min]=rs[i]; count[min]=next; next++;\n            }\n            pf++;\n        }\n        for(j=0;j<f;j++) printf(\"%d\\t\",m[j]);\n        if(flag[i]==0) printf(\"PF %d\",pf);\n        printf(\"\\n\");\n    }\n    printf(\"Page Faults (LRU): %d\",pf);\n    getch();\n}" }

      {
        title: "Experiment 10 \u2014 Disk Scheduling: FCFS, SCAN, C-SCAN",
        aim: "To implement Disk Scheduling algorithms: FCFS, SCAN and C-SCAN.",
        theory: "Disk scheduling minimizes seek time. FCFS serves requests in order. SCAN moves arm in one direction servicing requests then reverses. C-SCAN only services in one direction then jumps back to start.",
        sections: [
          { heading: "FCFS Disk Scheduling (C)", content: "#include<stdio.h>\nint main() {\n    int queue[20],n,head,i,j,seek=0,max,diff;\n    float avg;\n    printf(\"Max disk range: \"); scanf(\"%d\",&max);\n    printf(\"Queue size: \"); scanf(\"%d\",&n);\n    printf(\"Disk positions: \");\n    for(i=1;i<=n;i++) scanf(\"%d\",&queue[i]);\n    printf(\"Initial head: \"); scanf(\"%d\",&head);\n    queue[0]=head;\n    for(j=0;j<=n-1;j++) {\n        diff=abs(queue[j+1]-queue[j]);\n        seek+=diff;\n        printf(\"%d -> %d (seek %d)\\n\",queue[j],queue[j+1],diff);\n    }\n    printf(\"Total seek: %d\\nAvg: %.2f\\n\",seek,seek/(float)n);\n    return 0;\n}" },
          { heading: "SCAN Disk Scheduling (C)", content: "#include<stdio.h>\nint main() {\n    int queue[20],n,head,i,j,seek=0,max,diff,temp;\n    int q1[20],q2[20],t1=0,t2=0;\n    printf(\"Max range: \"); scanf(\"%d\",&max);\n    printf(\"Head: \"); scanf(\"%d\",&head);\n    printf(\"Queue size: \"); scanf(\"%d\",&n);\n    printf(\"Positions: \");\n    for(i=1;i<=n;i++) {\n        scanf(\"%d\",&temp);\n        if(temp>=head) q1[t1++]=temp; else q2[t2++]=temp;\n    }\n    for(i=0;i<t1-1;i++) for(j=i+1;j<t1;j++) if(q1[i]>q1[j]) { temp=q1[i]; q1[i]=q1[j]; q1[j]=temp; }\n    for(i=0;i<t2-1;i++) for(j=i+1;j<t2;j++) if(q2[i]<q2[j]) { temp=q2[i]; q2[i]=q2[j]; q2[j]=temp; }\n    for(i=1,j=0;j<t1;i++,j++) queue[i]=q1[j];\n    queue[i]=max;\n    for(i=t1+2,j=0;j<t2;i++,j++) queue[i]=q2[j];\n    queue[0]=head;\n    for(j=0;j<=n+1;j++) {\n        diff=abs(queue[j+1]-queue[j]); seek+=diff;\n        printf(\"%d -> %d (seek %d)\\n\",queue[j],queue[j+1],diff);\n    }\n    printf(\"Total: %d\\nAvg: %.2f\\n\",seek,seek/(float)n);\n    return 0;\n}" },
          { heading: "C-SCAN Disk Scheduling (C)", content: "#include<stdio.h>\n#include<stdlib.h>\nint main() {\n    int queue[20],n,head,i,j,seek=0,max,diff,temp;\n    int q1[20],q2[20],t1=0,t2=0;\n    printf(\"Max range: \"); scanf(\"%d\",&max);\n    printf(\"Head: \"); scanf(\"%d\",&head);\n    printf(\"Queue size: \"); scanf(\"%d\",&n);\n    printf(\"Positions: \");\n    for(i=1;i<=n;i++) {\n        scanf(\"%d\",&temp);\n        if(temp>=head) q1[t1++]=temp; else q2[t2++]=temp;\n    }\n    for(i=0;i<t1-1;i++) for(j=i+1;j<t1;j++) if(q1[i]>q1[j]) { temp=q1[i]; q1[i]=q1[j]; q1[j]=temp; }\n    for(i=0;i<t2-1;i++) for(j=i+1;j<t2;j++) if(q2[i]>q2[j]) { temp=q2[i]; q2[i]=q2[j]; q2[j]=temp; }\n    for(i=1,j=0;j<t1;i++,j++) queue[i]=q1[j];\n    queue[i++]=max; queue[i++]=0;\n    for(j=0;j<t2;i++,j++) queue[i]=q2[j];\n    queue[0]=head;\n    for(j=0;j<=n+1;j++) {\n        diff=abs(queue[j+1]-queue[j]); seek+=diff;\n        printf(\"%d -> %d (seek %d)\\n\",queue[j],queue[j+1],diff);\n    }\n    printf(\"Total: %d\\nAvg: %.2f\\n\",seek,seek/(float)n);\n    return 0;\n}" }
        ],
        conclusion: "FCFS, SCAN, and C-SCAN disk scheduling algorithms were successfully implemented."

        sections: [
          { heading: "Tables with Constraints (SQL)", content: "-- 1. Customer Table\nCREATE TABLE Customer (\n  Customer_ID INT PRIMARY KEY,\n  Name VARCHAR(50) NOT NULL,\n  Email VARCHAR(100) UNIQUE,\n  Phone VARCHAR(15) UNIQUE,\n  Address VARCHAR(150)\n);\n\n-- 2. Category Table\nCREATE TABLE Category (\n  Category_ID INT PRIMARY KEY,\n  Category_Name VARCHAR(50) NOT NULL\n);\n\n-- 3. Product Table\nCREATE TABLE Product (\n  Product_ID INT PRIMARY KEY,\n  Product_Name VARCHAR(50) NOT NULL,\n  Price DECIMAL(10,2) CHECK (Price > 0),\n  Category_ID INT,\n  FOREIGN KEY (Category_ID) REFERENCES Category(Category_ID)\n);\n\n-- 4. Orders Table\nCREATE TABLE Orders (\n  Order_ID INT PRIMARY KEY,\n  Customer_ID INT,\n  Order_Date DATE NOT NULL,\n  Total_Amount DECIMAL(10,2),\n  FOREIGN KEY (Customer_ID) REFERENCES Customer(Customer_ID)\n);\n\n-- 5. Order_Details Table\nCREATE TABLE Order_Details (\n  Order_Detail_ID INT PRIMARY KEY,\n  Order_ID INT,\n  Product_ID INT,\n  Quantity INT CHECK (Quantity > 0),\n  Price DECIMAL(10,2) CHECK (Price >= 0),\n  FOREIGN KEY (Order_ID) REFERENCES Orders(Order_ID),\n  FOREIGN KEY (Product_ID) REFERENCES Product(Product_ID)\n);\n\n-- 6. Payment Table\nCREATE TABLE Payment (\n  Payment_ID INT PRIMARY KEY,\n  Order_ID INT,\n  Payment_Date DATE,\n  Amount DECIMAL(10,2) CHECK (Amount > 0),\n  Payment_Mode VARCHAR(20),\n  FOREIGN KEY (Order_ID) REFERENCES Orders(Order_ID)\n);" }

        sections: [
          { heading: "SQL Joins (SQL)", content: "-- 1. INNER JOIN - Returns only matching records\nSELECT Customer.Name, Orders.Order_ID, Orders.Total_Amount\nFROM Customer\nINNER JOIN Orders ON Customer.Customer_ID = Orders.Customer_ID;\n\n-- 2. LEFT JOIN - All from LEFT + matching from RIGHT\nSELECT Customer.Name, Orders.Order_ID\nFROM Customer\nLEFT JOIN Orders ON Customer.Customer_ID = Orders.Customer_ID;\n\n-- 3. RIGHT JOIN - All from RIGHT + matching from LEFT\nSELECT Customer.Name, Orders.Order_ID\nFROM Customer\nRIGHT JOIN Orders ON Customer.Customer_ID = Orders.Customer_ID;\n\n-- 4. FULL OUTER JOIN - All records from both tables\nSELECT Customer.Name, Orders.Order_ID\nFROM Customer\nFULL OUTER JOIN Orders ON Customer.Customer_ID = Orders.Customer_ID;\n\n-- 5. CROSS JOIN - Cartesian product (all combinations)\nSELECT Customer.Name, Product.Product_Name\nFROM Customer\nCROSS JOIN Product;\n\n-- 6. SELF JOIN - Table joined with itself\nSELECT A.Name AS Customer1, B.Name AS Customer2\nFROM Customer A, Customer B\nWHERE A.Customer_ID <> B.Customer_ID;" }

// ── STATE ──
let currentSubjectIdx = null;

// ── BUILD SUBJECT CARDS ──
const subjectListEl = document.getElementById('subject-list');
subjects.forEach((sub, i) => {
  const card = document.createElement('div');
  card.className = 'subject-card';
  card.innerHTML = '<span class="s-icon">' + sub.icon + '</span><span class="s-name">' + sub.name + '</span><span class="s-count">' + sub.experiments.length + ' experiments</span>';
  card.onclick = () => openSubject(i);
  subjectListEl.appendChild(card);
});

function openDrawer() {
  showSubjects();
  document.getElementById('exp-drawer').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function showSubjects() {
  document.getElementById('drawer-title').innerHTML = 'Subjects';
  document.getElementById('subject-list-wrap').style.display = '';
  document.getElementById('exp-list').style.display = 'none';
  currentSubjectIdx = null;
}

function openSubject(idx) {
  currentSubjectIdx = idx;
  const sub = subjects[idx];
  document.getElementById('drawer-title').innerHTML =
    '<button class="drawer-back" onclick="showSubjects()">\u2190</button> ' + sub.name;
  document.getElementById('subject-list-wrap').style.display = 'none';
  const list = document.getElementById('exp-list');
  list.style.display = '';
  list.innerHTML = '';
  sub.experiments.forEach((exp, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    const num = String(i + 1).padStart(2, '0');
    btn.innerHTML = '<span class="exp-num">' + num + '</span>' + exp.title.replace(/Experiment \d+ \u2014 /, '');
    btn.onclick = () => openExp(i);
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function closeDrawer() {
  document.getElementById('exp-drawer').classList.remove('open');
  document.body.style.overflow = '';
}

function closeDrawerOutside(e) {
  if (e.target === document.getElementById('exp-drawer')) closeDrawer();
}

function openExp(idx) {
  closeDrawer();
  const exp = subjects[currentSubjectIdx].experiments[idx];
  document.getElementById('exp-page-title').textContent = exp.title;
  let html = '';
  if (exp.aim)    html += '<h2>Aim</h2><p>' + exp.aim + '</p>';
  if (exp.theory) html += '<h2>Theory</h2><p>' + exp.theory + '</p>';
  exp.sections.forEach(sec => {
    html += '<h2>' + sec.heading + '</h2><div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Copy</button><pre>' + escHtml(sec.content) + '</pre></div>';
  });
  if (exp.conclusion) html += '<h2>Conclusion</h2><p>' + exp.conclusion + '</p>';
  document.getElementById('exp-page-body').innerHTML = html;
  document.getElementById('exp-page').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePage() {
  document.getElementById('exp-page').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('exp-drawer').classList.add('open');
  document.body.style.overflow = 'hidden';
  openSubject(currentSubjectIdx);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyCode(btn) {
  const code = btn.nextElementSibling.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  });
}
